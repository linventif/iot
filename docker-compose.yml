services:
    api:
        image: ghcr.io/linventif/iot/api:latest
        build:
            context: .
            dockerfile: apps/api/Dockerfile
        restart: unless-stopped
        env_file: .env
        environment:
            HOST: 0.0.0.0
            PORT: ${API_CONTAINER_PORT:-4001}
            API_ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS:-https://pool.linv.dev,https://iot.linv.dev,https://iot-dev.linv.dev,http://localhost:4000,http://127.0.0.1:4000,http://localhost:4001,http://127.0.0.1:4001,http://192.168.1.69:4001,http://192.168.1.97:4001,http://192.168.50.71:4001}
            SQLITE_FILE: ${SQLITE_FILE:-/data/iot.sqlite}
            DATABASE_URL: file:${SQLITE_FILE:-/data/iot.sqlite}
        ports:
            - '${API_PUBLIC_PORT:-4001}:${API_CONTAINER_PORT:-4001}'
        volumes:
            - sqlite_data:/data

volumes:
    sqlite_data:
