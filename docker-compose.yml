services:
    db:
        image: mariadb:11
        restart: unless-stopped
        env_file: .env
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
            MYSQL_DATABASE: ${MYSQL_DATABASE}
            MYSQL_USER: ${MYSQL_USER}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD}
        ports:
            - '${MYSQL_PUBLIC_PORT:-3307}:${MYSQL_CONTAINER_PORT:-3306}'
        volumes:
            - db_data:/var/lib/mysql
        healthcheck:
            test:
                [
                    'CMD',
                    'mysqladmin',
                    'ping',
                    '-h',
                    'localhost',
                    '-p${MYSQL_ROOT_PASSWORD}',
                ]
            interval: 5s
            timeout: 3s
            retries: 20
            start_period: 10s

    api:
        image: ghcr.io/linventif/iot/api:latest
        pull_policy: always
        restart: unless-stopped
        env_file: .env
        environment:
            PORT: ${API_CONTAINER_PORT:-4001}
            MYSQL_HOST: ${MYSQL_HOST:-db}
            MYSQL_PORT: ${MYSQL_API_PORT:-3306}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
            MYSQL_DATABASE: ${MYSQL_DATABASE}
            MYSQL_USER: ${MYSQL_USER}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD}
            DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@${MYSQL_HOST:-db}:${MYSQL_API_PORT:-3306}/${MYSQL_DATABASE}
        ports:
            - '${API_PUBLIC_PORT:-4001}:${API_CONTAINER_PORT:-4001}'
        depends_on:
            db:
                condition: service_healthy

    cloudflared:
        image: cloudflare/cloudflared:latest
        pull_policy: always
        restart: unless-stopped
        env_file: .env
        command:
            - sh
            - -c
            - |
                if [ -n "$$CLOUDFLARED_TOKEN" ]; then
                  cloudflared tunnel --no-autoupdate run --token "$$CLOUDFLARED_TOKEN";
                elif [ -n "$$CLOUDFLARED_CONFIG_YAML_B64" ]; then
                  printf '%s' "$$CLOUDFLARED_CONFIG_YAML_B64" | base64 -d > /tmp/config.yml;
                  cloudflared tunnel --no-autoupdate --config /tmp/config.yml run;
                elif [ -n "$$CLOUDFLARED_TUNNEL_ID" ] && [ -n "$$CLOUDFLARED_HOSTNAME" ] && [ -n "$$CLOUDFLARED_CREDENTIALS_JSON_B64" ]; then
                  printf '%s' "$$CLOUDFLARED_CREDENTIALS_JSON_B64" | base64 -d > /tmp/credentials.json;
                  printf '%s\n' \
                    "tunnel: $$CLOUDFLARED_TUNNEL_ID" \
                    "credentials-file: /tmp/credentials.json" \
                    "" \
                    "ingress:" \
                    "  - hostname: $$CLOUDFLARED_HOSTNAME" \
                    "    service: $${CLOUDFLARED_SERVICE_URL:-http://api:4001}" \
                    "  - service: http_status:404" > /tmp/config.yml;
                  cloudflared tunnel --no-autoupdate --config /tmp/config.yml run;
                else
                  cloudflared tunnel --no-autoupdate --config /etc/cloudflared/config.yml run;
                fi
        depends_on:
            api:
                condition: service_started
        volumes:
            - ./cloudflared:/etc/cloudflared:ro

volumes:
    db_data:
